[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-optimizer"
version = "0.1.0"
description = "Variational quantum optimization project derived from a JAX/PennyLane notebook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "jaxopt>=0.8.3",
  "pennylane>=0.37.0",
]

[project.scripts]
quantum-optimizer = "quantum_optimizer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
